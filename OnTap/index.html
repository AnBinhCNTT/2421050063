<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <style>
    .muc1{
        color:aliceblue;
         /* đổi màu chữ */
        background-color: blue;
        /* đổi màu nền */
        font-size: 20px;
        /* Đổi kích thước chữ */
        width: 200px; 
        /* Chiều rộng */
        height: 100px;
        /* Chiều cao */
        text-align: center;
        /* Căn lề văn bản( hoặc  left, right, justify) */
        margin: 20px;
        /* Khoảng cách bên ngoài phần tử (lề) */
        padding: 10px;
        /* Khoảng cách bên trong phần tử (đệm) */
        border: 1px solid black;
        /* Viền xung quanh phần tử */
        text-decoration: none;
        /* Trang trí chữ (gạch chân, gạch ngang)(underline, line-through) */
        line-height:normal;
        /* cách giữa các dòng (chiều cao dòng)	1.5, 24px */
        border-radius:	8px;
        /* Bo tròn góc đường viền	8px, 50% (tạo hình tròn) */
        display:block;
        /* Cách hiển thị phần tử trên trang	block(Chiếm toàn bộ chiều rộng sẵn có của dòng),
         inline((Phần tử trên cùng một dòng), inline-block, 
         flex(phần tử linh hoạt 1 chiều), 
         grid((Bố cục lưới 2 chiều),... none */
        justify-content:flex-start;
         /* Căn chỉnh các phần tử con theo trục chính (center, space-between, flex-start). */
        align-items: stretch;
         /* Căn chỉnh các phần tử con theo trục vuông góc (center, stretch, flex-start). */
        gap: 16px;
         /* Khoảng cách giữa các phần tử con bên trong container flex/grid (VD: gap: 16px;). */
        flex-direction: row;
        /* Hướng sắp xếp (row - hàng ngang, column - cột dọc). */
        object-fit: cover; 
        /* dùng để căn chỉnh kích thước của các phần tử làm đầy ko bị méo ảnh */
        flex:1;
        /* Dãn ra toàn bộ  không fian trong cha */
        /* padding-bottom: Khoảng cách bên trong (giữa nội dung và viền đáy). */
        /* border-bottom: Đường viền ở đáy. */
        /* margin-bottom: Khoảng trống bên ngoài đường viền đáy, dùng để giữ khoảng cách với phần tử tiếp theo */
        /* box-sizing: border-box giúp đặt kích thước bao nhiêu thì phần tử sẽ nằm gọn gàng đúng bấy nhiêu, không bao giờ bị viền hay khoảng đệm làm vỡ bố cục. */

    }
     </style>
</body>
<header>là phần trên cùng của trang</header>
<nav>bao bọc khối liên kết điều hướng chính của một trang web hoặc ứng dụng</nav>
<main>bao bọc toàn bộ nội dung trọng tâm, độc nhất và quan trọng nhất của trang web.</main>
</html>
