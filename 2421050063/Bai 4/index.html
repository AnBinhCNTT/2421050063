<html>
    <head>
        <title>Bai 4</title>
    </head>
    <body>
<h1>form</h1>
<form>
    <div>
        <!-- Input nếu không chuyền type thì mặc định là text -->
        Họ và tên: <input type="text" name="hoVaTen">
    </div>
    <div>
        Giới thiệu: <textarea name="gioiThieu"></textarea>
            <!-- textarea tạo bảng to -->
    </div>
    <div>
        <p><b>Email</b></p>
        <input type="email" name="email">
    </div>
    <p><b> Số Điện Thoại</b></p>
    <input name="soDienThoai"
    type="tel"
    placeholder="dạng số điện thoại: 0xxxxxxxxx"
    required
     pattern="([0]{1}([9,3,6,8]{1})([0-9]{8}))">
    <!-- Số đầu tiên là 0 -->
    <!-- Số tiếp theo:9,3,6,8 -->
    <!-- 8 số tiếp theo là số bất kỳ từ 0-9 -->
     <div>
        <p><b>Giới tính</b></p>
        <input type="radio" name="gioiTinh" value="Nam">Nam<br>
        <input type="radio" name="gioiTinh" value="Nữ">Nữ<br>
     </div>
     <div>
        <p><b>Sở thích</b></p>
        Game:<input type="checkbox" name="soThich" value="Game"><br>
        Music:<input type="checkbox" name="soThich" value="music"><br>
        Sport:<input type="checkbox" name="soThich" value="sport"><br>
     </div>
     <div>
        <p><b>Trình duyệt web hay sử dụng</b></p>
        <input list="browsers">
        <datalist id="browsers">
            <option value="Chrome">
            <option value="CocCoc">
            <option value="FireFox">
            <option value="Edge">
        </datalist>
         
<select name="browsers">
    <option value="Internet Explorer">Internet Explorer</option>
    <option value="Firefox">Firefox</option>
    <option value="Chrome">Chrome</option> 
    <option value="Safari">Safari</option>
    <option value="Opera">Opera</option>
    <option value="Cốc Cốc">Cốc Cốc</option>
</select>
     </div>
     <div>
       Hạn mức: 100k<input type="range" id="a" value="50">1tỉ
     </div>
    <div>
        <input type="submit">
        <button>click</button>
        <!-- giống nhau -->
         <input type="reset">
    </div>
    <div>
   <iframe width="560" height="315" src="https://www.youtube.com/embed/JB6ZwyL8OzU?si=AJs6fKvnzzK0cycE" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
    </div>
</form>
