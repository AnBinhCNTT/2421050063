<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bai5</title>
    <link rel="stylesheet" href="style.css" type="text/css">
    
    
    <style>
        h2{
             color:azure; /*color dùng để quy định màu chữ */
        }
        #TieuDe{
            color:aqua
        }
    </style>
</head>
<body>
    <!-- I.Cac kieu style -->
    <!-- Kiểu 1 viết style trong thẻ -->
     <h1 style="color:Blue">HUMG</h1>
     <!-- Kiểu 2 viết style ngoài thẻ -->
      <h2>Trường đại học Mỏ-Địa Chất</h2>
      <!--Loai1: inline style viet truc tap trong the -->
      <!-- Loai2: Internal style viet ben ngoai the -->
       <h3>Lớp phát triển ứng dụng web</h3>
       <!-- II.selector -->
        <!-- Cach1: Sử dụng tên thẻ -->
        <!-- cách2: dùng id viết dấu # trước tên id-->
         <h2 id="TieuDe">Trường đại học Mỏ-Địa Chất</h2>
         <!-- Cách3: Dùng class viết dấu . trước tên class -->
          <h2 id="tieuDe" class="tieuDe">Trường đại học Mỏ-Địa Chất</h2>

          <h3 class="tieuDe2">NguyenAnBinh</h3>
</body>
</html>
