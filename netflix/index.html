<script>
        // Mảng lưu trữ thông tin của 2 phim
        var danhSachPhim = [
            {
                id: 1,
                ten: "Cảnh sát trưởng Labrado",
                thoiLuong: 20,
                trailer: "https://www.youtube.com/embed/0rigHDn68qQ?si=jBoybNdyhE9eThQM"
            },
            {
                id: 2,
                ten: "Zootopia",
                thoiLuong: 15,
                trailer: "https://www.youtube.com/embed/0rigHDn68qQ?si=jBoybNdyhE9eThQM"
            }
        ];

        // Bấm vào ảnh banner thì hiện video mặc định của banner
        function xemTrailer() {
            document.getElementsByClassName("banner")[0].style.display = "none";
            document.getElementsByClassName("banner")[1].style.display = "block";
        }
        // Bấm vào ảnh phim (theo id) để đổi video trailer và chạy lên banner
        function Phim(id) {
            var bannerAnh = document.getElementsByClassName("banner")[0];
            var bannerTrailer = document.getElementsByClassName("banner")[1];
            var iframe = bannerTrailer.getElementsByTagName("iframe")[0];

            for (var i = 0; i < danhSachPhim.length; i++) {
                if (danhSachPhim[i].id == id) {
                    iframe.src = danhSachPhim[i].trailer;
                    bannerAnh.style.display = "none";
                    bannerTrailer.style.display = "block";
                }
            }
        }
